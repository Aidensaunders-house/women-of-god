<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffcff">
  <meta name="description" content="Women of God · Kingdom Living. An interactive conversation and reflection guide on godliness and boundaries.">
  <title>Women of God · Kingdom Living</title>
  <style>
    :root {
      color-scheme: light; --ink:#261745; --muted:#5c526c; --paper:#fffcff;
      --purple:#633784; --jade:#146957; --rose:#a13470; --line:#e3d8e8;
      --lavender:#f0e8f8; --mint:#e6f4ef; --blush:#fae9f2;
      font-family:'Segoe UI',system-ui,sans-serif; color:var(--ink); background:#f3edf5;
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; padding:clamp(12px,3vw,44px); }
    button { font:inherit; color:inherit; cursor:pointer; }
    button:focus-visible, a:focus-visible { outline:3px solid var(--jade); outline-offset:4px; }
    button:disabled { cursor:default; opacity:.4; }
    .shell { display:flex; flex-direction:column; position:relative; isolation:isolate; overflow:hidden; max-width:1200px; min-height:min(760px,calc(100svh - 2 * clamp(12px,3vw,44px))); margin:auto; border:1px solid var(--line); border-radius:28px; background:var(--paper); }
    .shell > * { position:relative; z-index:1; }
    header, footer { padding:22px clamp(22px,5vw,66px); display:flex; align-items:center; justify-content:space-between; gap:14px; }
    header { min-height:76px; }
    nav, .actions { display:flex; gap:9px; flex-wrap:wrap; }
    .identity, .eyebrow { color:var(--purple); font-weight:750; letter-spacing:.14em; text-transform:uppercase; font-size:.77rem; }
    .identity { display:flex; gap:9px; align-items:center; text-align:left; border:0; background:none; padding:4px 0; }
    .identity::before { content:''; width:17px; height:17px; flex:none; border:2px solid var(--jade); border-right-color:var(--rose); border-bottom-color:var(--purple); border-radius:50% 50% 50% 22%; transform:rotate(-25deg); }
    main { padding:clamp(26px,5vw,70px) clamp(22px,5vw,66px) 38px; flex:1; }
    main:focus { outline:none; }
    h1,h2,p,dl,dd { margin:0; }
    h1,h2 { font-family:Georgia,'Times New Roman',serif; font-weight:400; line-height:1.06; letter-spacing:-.035em; text-wrap:balance; }
    h1 { font-size:clamp(2.05rem,5.8vw,4.45rem); max-width:880px; }
    h2 { font-size:clamp(1.28rem,2.6vw,2rem); }
    p { line-height:1.55; }
    .eyebrow { display:block; margin-bottom:14px; }
    .lede { font-size:clamp(1rem,1.9vw,1.23rem); color:var(--muted); margin-top:17px; max-width:670px; }
    footer { border-top:1px solid var(--line); background:var(--paper); }
    .step-status { color:var(--muted); font-size:.86rem; }
    button.control, button.solid, .open-topic { min-height:42px; border:1px solid var(--line); border-radius:50px; padding:9px 16px; background:var(--paper); font-weight:650; }
    button.control:hover:not(:disabled), .open-topic:hover { background:var(--lavender); }
    button.solid { background:var(--purple); border-color:var(--purple); color:white; }
    button.solid:hover { background:#4d286a; }
    .cover h1 { font-family:'Segoe UI',system-ui,sans-serif; font-weight:800; color:var(--ink); text-transform:uppercase; letter-spacing:-.06em; line-height:1; font-size:clamp(2.5rem,8.8vw,6.5rem); }
    .cover .script { display:block; color:var(--jade); font-family:'Segoe Script','Brush Script MT','Apple Chancery',Georgia,serif; font-size:clamp(2.4rem,7.7vw,5.7rem); font-weight:400; letter-spacing:-.065em; line-height:1.21; margin:10px 0 22px; }
    .cover .eyebrow { margin-bottom:21px; }
    .cover .actions { margin-top:26px; }
    .ribbons { position:absolute; z-index:0; inset:0; overflow:hidden; pointer-events:none; }
    .ribbons i { position:absolute; width:68%; height:64%; border:clamp(18px,4vw,62px) solid #ddc6ee; border-radius:50%; right:-44%; bottom:-18%; transform:rotate(-33deg); opacity:.65; }
    .ribbons i:nth-child(2) { border-color:#a3dbc8; right:-39%; bottom:-26%; transform:rotate(-55deg); }
    .ribbons i:nth-child(3) { border-color:#edb8d5; right:-29%; bottom:-41%; transform:rotate(-12deg); }
    .shell:not([data-scene="0"]) .ribbons { opacity:.20; }
    .quote { margin-top:30px; max-width:640px; padding:16px 20px; border-left:3px solid var(--jade); color:var(--jade); background:var(--mint); border-radius:0 12px 12px 0; }
    .teaching { margin-top:29px; display:grid; gap:0; max-width:920px; }
    .teaching > div { display:grid; grid-template-columns:minmax(140px, 1fr) 3fr; gap:18px; align-items:baseline; padding:14px 0; border-top:1px solid var(--line); }
    .teaching dt { font-weight:720; color:var(--purple); }
    .teaching dd { color:var(--muted); line-height:1.5; }
    .split { display:grid; grid-template-columns:1.15fr .85fr; gap:30px; align-items:center; }
    .diagram { position:relative; border-radius:22px; background:linear-gradient(135deg,var(--lavender),var(--mint)); min-height:240px; overflow:hidden; }
    .diagram > .graphic { position:absolute; inset:0 0 37px; display:grid; place-items:center; }
    .graphic span { display:block; grid-area:1/1; transition:opacity .55s, transform .55s; }
    .time-line { height:4px; width:70%; background:var(--purple); position:relative; transform:translateY(36px); }
    .time-line::after { content:''; position:absolute; inset:-7px 0; background:repeating-linear-gradient(90deg,var(--purple) 0 2px,transparent 2px 16%); }
    .space-plane { width:62%; height:115px; border:3px solid var(--jade); border-radius:15px; transform:skewX(-24deg) translateY(25px); background:#a9dec63f; opacity:0; }
    .matter-shape { width:74px; height:74px; border:3px solid var(--rose); border-radius:16px; background:linear-gradient(145deg,#f2c2dc,#c267a1); transform:rotate(-12deg) translateY(20px); opacity:0; }
    .diagram[data-phase="1"] .space-plane { opacity:1; transform:skewX(-24deg); }
    .diagram[data-phase="2"] .space-plane { opacity:.52; transform:skewX(-24deg); }
    .diagram[data-phase="2"] .matter-shape { opacity:1; transform:rotate(-12deg) translateY(-9px); }
    .diagram:not([data-phase="0"]) .time-line { opacity:.35; }
    .diagram figcaption { position:absolute; bottom:18px; left:10px; right:10px; display:flex; justify-content:center; gap:18px; font-size:.84rem; font-weight:700; color:var(--muted); }
    .diagram[data-phase="0"] figcaption span:nth-child(1), .diagram[data-phase="1"] figcaption span:nth-child(2), .diagram[data-phase="2"] figcaption span:nth-child(3) { color:var(--ink); text-decoration:underline; text-underline-offset:5px; }
    figure { margin:0; }
    .topic-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; margin:26px 0 14px; }
    .topic-grid button { min-height:96px; text-align:left; font-weight:750; background:var(--lavender); color:var(--ink); border:1px solid transparent; border-radius:15px; padding:16px; line-height:1.35; }
    .topic-grid button:nth-child(3n+2) { background:var(--mint); }
    .topic-grid button:nth-child(3n) { background:var(--blush); }
    .topic-grid button:hover { border-color:var(--purple); }
    .discussion, .closing { max-width:850px; }
    .stage-switch { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 27px; }
    button[aria-current="step"] { background:var(--lavender); border-color:var(--purple); color:var(--purple); }
    .discussion .eyebrow { color:var(--jade); }
    .discussion .quote { border-color:var(--purple); background:var(--lavender); color:var(--purple); }
    .prayer { max-width:730px; }
    .prayer p { color:var(--jade); font-family:Georgia,serif; font-size:clamp(1.1rem,2.6vw,1.8rem); margin-top:22px; }
    dialog { border:1px solid var(--line); background:var(--paper); color:var(--ink); padding:24px; border-radius:20px; max-width:min(520px,calc(100vw - 32px)); }
    dialog::backdrop { background:#23153665; }
    dialog menu { padding:0; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    dialog menu button { text-align:left; }
    @media(max-width:690px) {
      header,footer { flex-wrap:wrap; }
      main { padding-top:30px; }
      .split { grid-template-columns:1fr; gap:18px; }
      .diagram { min-height:195px; }
      .topic-grid { grid-template-columns:1fr 1fr; }
      .teaching > div { grid-template-columns:1fr; gap:4px; }
      .cover .script { margin-bottom:17px; }
    }
    @media(max-width:370px) { .topic-grid, dialog menu { grid-template-columns:1fr; } }
    @media(prefers-reduced-motion:reduce) { .graphic span { transition:none; } }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <div class="ribbons" aria-hidden="true"><i></i><i></i><i></i></div>
    <header>
      <button class="identity" data-scene="0" aria-label="Women of God home">Women of God</button>
      <nav aria-label="Guide navigation">
        <button class="control" data-scene="5">Topics</button>
        <button class="control" id="contents-button">Contents</button>
      </nav>
    </header>
    <main id="page" tabindex="-1"></main>
    <footer>
      <span class="step-status" id="status" aria-live="polite"></span>
      <div class="actions">
        <button class="control" id="previous">Back</button>
        <button class="solid" id="next">Next</button>
      </div>
    </footer>
  </div>
  <dialog id="contents" aria-labelledby="contents-title">
    <h2 id="contents-title">Contents</h2>
    <menu id="contents-list"></menu>
    <form method="dialog"><button class="control">Close</button></form>
  </dialog>
  <noscript>This interactive guide needs JavaScript enabled in your browser.</noscript>
  <script>
    // Shared topic catalogue.
    const groups = [
      {"title":"Desire & integrity","topics":["sex-lust","pornography","secret-habits","self-control"]},
      {"title":"Relationships & home","topics":["relationships","dating","marriage","family","fatherhood"]},
      {"title":"Work & resources","topics":["ambition","money","purpose"]},
      {"title":"Attention & influence","topics":["phone-content","comparison","friendships"]},
      {"title":"Inner life & escape","topics":["anger","pride-ego","serving","isolation","substances-escape"]},
      {"title":"Rest & life with God","topics":["rest","prayer","spiritual-discipline","discipline"]}
    ];
    const topics = [
      {"id":"sex-lust","title":"Sex & Lust","open":"What is desire teaching you to pursue?","prompts":["What would healthy, God-honouring sexuality look like?","What is sacred about your body and another person?","When does desire begin to turn a person into an object?","What practical line protects purity, dignity and love?"],"close":"Make room for desire guided by honour, dignity and love."},
      {"id":"pornography","title":"Pornography","open":"What does the screen promise—and what does it take?","prompts":["What would freedom, honesty and healthy intimacy look like?","What must be honoured in your mind, body and relationships?","What situations make secrecy and escape feel attractive?","What access, habit or secrecy needs to change?"],"close":"Make room for honesty, freedom and real intimacy."},
      {"id":"secret-habits","title":"Secret Habits","open":"What grows stronger when nobody can see it?","prompts":["What would an integrated public and private life look like?","What does honesty protect in your walk with God?","What keeps the habit hidden and repeated?","What specific step brings truth and support into this area?"],"close":"Make room for honesty in the parts of life no one else sees."},
      {"id":"self-control","title":"Self-Control","open":"Who is leading when your impulses speak?","prompts":["What would a Spirit-led response look like under pressure?","What conviction deserves more weight than the urge?","When are you most likely to abandon that conviction?","What pause, limit or replacement response can you practise?"],"close":"Make room to respond with self-control when you feel the pull to react."},
      {"id":"relationships","title":"Women & Relationships","open":"Does the way you relate communicate honour?","prompts":["What would truthful, respectful relationships look like?","How do dignity, agency and clarity shape your choices?","Where do entitlement, ambiguity or objectification enter?","What line would make your intentions and conduct honourable?"],"close":"Make room for relationships marked by respect, clear intentions and dignity."},
      {"id":"dating","title":"Dating","open":"Are your intentions as clear as your attention?","prompts":["What kind of relationship are you seeking to build?","What must honesty, faith and mutual respect protect?","Where are pressure or mixed signals leading the relationship?","What conversation or agreed limit is needed now?"],"close":"Make room for honesty about where the relationship is going."},
      {"id":"marriage","title":"Marriage","open":"What does your marriage receive after everything else?","prompts":["What would faithful, attentive love look like at home?","What protects trust, safety and connection?","What quietly competes with those commitments?","What shared rhythm or personal decision would protect them?"],"close":"Make room for the trust and connection you want in your marriage."},
      {"id":"family","title":"Family","open":"Who gets your best—and who gets what is left?","prompts":["What atmosphere should your family experience around you?","What must be protected for love and trust to grow?","What patterns make home tense, distant or unpredictable?","What will you begin, stop or make dependable?"],"close":"Make room for your family to experience your attention and care."},
      {"id":"fatherhood","title":"Fatherhood","open":"What are the children learning from your presence?","prompts":["What kind of fatherly presence do you want the children in your life to experience?","What do attention, patience and consistency protect?","What steals your availability or shapes your reactions?","What dependable action will communicate love this week?"],"close":"Make room for your children to experience your patience and presence."},
      {"id":"ambition","title":"Work & Ambition","open":"When does ambition take what it was never entitled to?","prompts":["What kind of person should your work be helping you become?","What matters more than success?","When does achievement begin to cost you your character?","What should work never have unrestricted access to?"],"close":"Make room for what deserves your attention when work is done."},
      {"id":"money","title":"Money","open":"What does your money reveal about your trust?","prompts":["What would faithful, generous and responsible living look like?","What commitments deserve protection before appearances?","Where do comparison, impulse or secrecy shape spending?","What limit or transparent practice would honour those commitments?"],"close":"Make room for generosity and the commitments your money needs to serve."},
      {"id":"purpose","title":"Purpose","open":"Are you pursuing a calling—or proving your worth?","prompts":["Who are you becoming through what you pursue?","What convictions must remain intact along the way?","What distractions or comparisons pull you away?","What will you decline so you can respond faithfully?"],"close":"Make room to act faithfully on what you believe God is asking of you."},
      {"id":"phone-content","title":"Phone & Content","open":"What is discipling you through your screen?","prompts":["What should your attention be producing in you?","What deserves your undivided attention?","What content or habit competes for that attention?","What digital boundary will protect it in daily life?"],"close":"Make room to give your attention to what deserves it."},
      {"id":"comparison","title":"Social Media","open":"Whose approval is shaping your next move?","prompts":["What would a free and truthful digital life look like?","What protects contentment, integrity and attention?","How do comparison and reaction reshape your desires?","What account, rhythm or posting habit needs a limit?"],"close":"Make room for contentment when comparison demands your attention."},
      {"id":"friendships","title":"Friendships","open":"Who can tell you the truth and still stay close?","prompts":["What kind of friendship helps you grow toward God?","What do honesty, loyalty and wise counsel require?","What influence keeps you performing or compromising?","What access should deepen—and what influence needs a limit?"],"close":"Make room for friends who can tell you the truth and stay close."},
      {"id":"anger","title":"Anger","open":"What happens to others when you feel challenged?","prompts":["What would strength governed by gentleness look like?","What must remain safe when you disagree?","What thoughts or triggers escalate your response?","What will you do before anger becomes harmful action?"],"close":"Make room to disagree without losing gentleness or respect."},
      {"id":"pride-ego","title":"Pride / Ego","open":"What becomes difficult when you need to be right?","prompts":["What would humble confidence look like?","What do truth, teachability and service protect?","When does protecting your image outweigh hearing the truth?","What practice will make correction welcome?"],"close":"Make room to hear the truth when it is hard to take."},
      {"id":"serving","title":"People-Pleasing","open":"Which yes is costing you an honest no?","prompts":["What would loving others with honesty look like?","What responsibilities and limits need to be honoured?","Whose disappointment feels impossible to tolerate?","What clear, kind answer do you need to give?"],"close":"Make room for a kind, honest answer even when it disappoints someone."},
      {"id":"isolation","title":"Isolation","open":"Who knows how you are really doing?","prompts":["What would honest, dependable connection look like?","What do trusted friendships protect in your life?","What shame, fear or habit keeps you unreachable?","What regular contact will you commit to?"],"close":"Make room for someone to know how you are really doing."},
      {"id":"substances-escape","title":"Substances / Escape","open":"Where do you go when you do not want to feel?","prompts":["What would facing life with support and clarity look like?","What needs care beneath the urge to escape?","What situations repeatedly pull you toward numbing?","What access needs a limit—and what support needs an opening?"],"close":"Make room to face what you have been avoiding with support."},
      {"id":"rest","title":"Rest","open":"What are you afraid will happen if you stop?","prompts":["What would a sustainable rhythm of work and rest look like?","What do your health, relationships and trust in God require?","What makes constant availability feel necessary?","What time will you protect for genuine rest?"],"close":"Make room for rest you can count on."},
      {"id":"prayer","title":"Prayer","open":"Does God receive your presence or only your requests?","prompts":["What would a growing life of communion with God look like?","What place should attention and honesty have with Him?","What consistently displaces time with God?","What simple, repeatable prayer rhythm will you protect?"],"close":"Make room to be present with God in prayer."},
      {"id":"spiritual-discipline","title":"Spiritual Discipline","open":"What is your private life with God becoming?","prompts":["What fruit should your life with God be producing?","How will Scripture, prayer and obedience remain connected?","What turns a living relationship into a performance?","What practice can you begin faithfully and sustainably?"],"close":"Make room for Scripture, prayer and obedience to shape your week."},
      {"id":"discipline","title":"Discipline","open":"What do your repeated choices make room for?","prompts":["What kind of person are your habits helping you become?","What conviction needs a dependable rhythm?","What breaks that rhythm when motivation fades?","What small decision can become a consistent practice?"],"close":"Make room for a rhythm you can keep when motivation fades."},
      {"id":"open","title":"Open Conversation","open":"Where is the line being tested?","prompts":["What are we trying to cultivate here?","What must be valued, honoured or protected?","What threatens, weakens or competes with that value?","What boundary gives that outcome space to grow?"],"close":"Name what your boundary will make room for."}
    ];

    const scenes = ['Kingdom Living', 'Opening question', 'Faith and boundaries', 'Time, Space and Matter', 'The four questions', 'Choose a topic', 'Discussion', 'Reflection', 'Prayer'];
    const stages = ['Opening', 'Outcome', 'Value', 'Threat', 'Boundary'];
    const page = document.getElementById('page');
    const contents = document.getElementById('contents');
    let state = readLocation();
    let topicMenu = 'groups';
    let lensTimer;

    function readLocation() {
      const params = new URLSearchParams(location.hash.slice(1));
      const scene = Number(params.get('scene'));
      const step = Number(params.get('step'));
      return {
        scene: Number.isInteger(scene) && scene >= 0 && scene < scenes.length ? scene : 0,
        step: Number.isInteger(step) && step >= 0 && step < stages.length ? step : 0,
        topic: topics.find(item => item.id === params.get('topic'))?.id ?? 'open'
      };
    }

    function currentTopic() { return topics.find(item => item.id === state.topic); }

    function show(scene, step = 0, topic = state.topic) {
      state = { scene, step, topic };
      const params = new URLSearchParams({scene, step, topic});
      history.replaceState(null, '', `#${params}`);
      render();
      window.scrollTo(0, 0);
      page.focus({preventScroll:true});
    }

    function heading(title, intro = '') {
      return `<h1>${title}</h1>${intro ? `<p class="lede">${intro}</p>` : ''}`;
    }

    function teaching(rows) {
      return `<dl class="teaching">${rows.map(([label, detail]) => `<div><dt>${label}</dt><dd>${detail}</dd></div>`).join('')}</dl>`;
    }

    function topicMenuContent() {
      const group = groups[Number(topicMenu)];
      const entries = topicMenu === 'groups'
        ? groups.map(({title}, index) => `<button data-topic-menu="${index}">${title}</button>`)
        : (group ? group.topics.map(id => topics.find(item => item.id === id)) : topics.filter(item => item.id !== 'open'))
          .map(({id,title}) => `<button data-topic="${id}">${title}</button>`);
      return `${heading(group?.title ?? 'Where is the line being tested?')}
        <div class="topic-grid">${entries.join('')}</div>
        <div class="actions">
          ${topicMenu === 'groups' ? '<button class="control" data-topic-menu="all">See every topic</button>' : '<button class="control" data-topic-menu="groups">All areas</button>'}
          <button class="open-topic" data-topic="open">Let the room name it</button>
        </div>`;
    }

    function sceneContent() {
      const topic = currentTopic();
      switch (state.scene) {
        case 0:
          return `<section class="cover"><p class="eyebrow">A conversation circle</p><h1>Women of God</h1><span class="script">Kingdom Living</span><h2>Godliness + Boundaries</h2><div class="actions"><button class="solid" data-scene="1">Begin</button><button class="control" data-scene="5">Explore a topic</button></div></section>`;
        case 1:
          return `${heading('What does a woman protect when she genuinely reveres God?')}<p class="quote">Think of one commitment you want your choices to protect.</p>`;
        case 2:
          return `${heading('What are we protecting?')}${teaching([
            ['Fear of the Lord', 'Reverence means taking God’s holiness seriously in the choices we make.'],
            ['Boundaries', 'A boundary protects what we have already said yes to and makes room for that commitment to grow.'],
            ['Godliness', 'Time with God and obedience to Him shape who we are when no one is watching.']
          ])}<p class="lede">For reflection: Proverbs 4:23 and John 15:4–5.</p>`;
        case 3:
          return `<div class="split"><div>${heading('Time, Space and Matter', 'A lens for daily life, drawn from Genesis 1:1.')}${teaching([
            ['Time', 'Hours, attention and rest. What receives your time first?'],
            ['Space', 'Relationships and environments. Who or what gets access to you?'],
            ['Matter', 'Your body, money and possessions. What do your physical choices honour?']
          ])}</div><figure class="diagram" data-phase="0" aria-label="A line represents time, a plane represents space and a solid shape represents matter"><div class="graphic" aria-hidden="true"><span class="time-line"></span><span class="space-plane"></span><span class="matter-shape"></span></div><figcaption><span>Time</span><span>Space</span><span>Matter</span></figcaption></figure></div>`;
        case 4:
          return `${heading('Where do you draw the line?', 'Start with the fruit you want to cultivate. Then work through these four questions in order.')}${teaching([
            ['Outcome', 'What are we trying to cultivate?'],
            ['Value', 'What must we honour or protect for that to grow?'],
            ['Threat', 'What weakens or competes with that value?'],
            ['Boundary', 'What specific choice will protect it in practice?']
          ])}`;
        case 5:
          return topicMenuContent();
        case 6:
          return `<section class="discussion"><nav class="stage-switch" aria-label="Discussion steps">${stages.map((stage, i) => `<button class="control" data-step="${i}"${i === state.step ? ' aria-current="step"' : ''}>${stage}</button>`).join('')}</nav><p class="eyebrow">${topic.title}${state.step ? ` · ${stages[state.step]}` : ''}</p>${heading(state.step ? topic.prompts[state.step - 1] : topic.open)}${state.step === 4 ? '<p class="quote">What will you do, and when will you start?</p>' : ''}</section>`;
        case 7:
          return `<section class="closing"><p class="eyebrow">The life beyond the line${topic.id !== 'open' ? ` · ${topic.title}` : ''}</p>${heading(topic.close)}<p class="quote">Put it in your own words: “To protect what I value, I will…”</p></section>`;
        case 8:
          return `<section class="prayer">${heading('Prayer')}<p>Lord, help me honour You in the choices no one sees. Give me wisdom to recognise what needs protecting, courage to set the boundary, and grace to keep it with love. Amen.</p></section>`;
      }
    }

    function render() {
      clearInterval(lensTimer);
      document.getElementById('shell').dataset.scene = state.scene;
      page.innerHTML = sceneContent();
      const graphic = page.querySelector('.diagram');
      if (graphic) {
        lensTimer = setInterval(() => {
          graphic.dataset.phase = (Number(graphic.dataset.phase) + 1) % 3;
        }, 3000);
      }
      document.getElementById('status').textContent = state.scene === 6
        ? `${currentTopic().title} · ${state.step + 1} of ${stages.length}`
        : `${state.scene + 1} of ${scenes.length} · ${scenes[state.scene]}`;
      document.getElementById('previous').disabled = state.scene === 0;
      const next = document.getElementById('next');
      next.disabled = state.scene === 5;
      next.textContent = state.scene === 5 ? 'Choose a topic'
        : state.scene === 6 && state.step === 4 ? 'Reflection'
        : state.scene === 8 ? 'Start again' : 'Next';
    }

    function advance() {
      if (state.scene === 5) return;
      if (state.scene === 6 && state.step < stages.length - 1) return show(6, state.step + 1);
      if (state.scene === 8) return show(0, 0, 'open');
      show(state.scene + 1);
    }

    function back() {
      if (state.scene === 5 && topicMenu !== 'groups') {
        topicMenu = 'groups';
        return show(5);
      }
      if (state.scene === 6 && state.step > 0) return show(6, state.step - 1);
      if (state.scene === 7) return show(6, stages.length - 1);
      if (state.scene > 0) show(state.scene - 1);
    }

    document.getElementById('contents-list').innerHTML = scenes.map((label, index) => `<button class="control" data-scene="${index}">${label}</button>`).join('');
    document.getElementById('contents-button').addEventListener('click', () => contents.showModal());
    document.getElementById('previous').addEventListener('click', back);
    document.getElementById('next').addEventListener('click', advance);
    document.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const {scene, topic, step, topicMenu: menu} = button.dataset;
      if (scene !== undefined) {
        if (contents.open) contents.close();
        if (Number(scene) === 5) topicMenu = 'groups';
        show(Number(scene));
      } else if (menu !== undefined) {
        topicMenu = menu;
        show(5);
      } else if (topic !== undefined) {
        show(6, 0, topic);
      } else if (step !== undefined) {
        show(6, Number(step));
      }
    });
    document.addEventListener('keydown', event => {
      if (contents.open || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.key === 'ArrowRight') { event.preventDefault(); advance(); }
      if (event.key === 'ArrowLeft') { event.preventDefault(); back(); }
    });
    window.addEventListener('hashchange', () => { state = readLocation(); render(); });
    render();
  </script>
</body>
</html>
